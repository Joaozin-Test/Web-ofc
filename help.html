<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manox Hub V1.0</title>
  <!-- Ícones Phosphor Icons para reproduzir os ícones da imagem -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: #020514;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 81, 255, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(76, 0, 255, 0.25) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container Principal do Menu */
    .menu-container {
      width: 320px;
      background: rgba(10, 16, 38, 0.75);
      border: 2px solid #0055ff;
      border-radius: 20px;
      box-shadow: 
        0 0 15px rgba(0, 85, 255, 0.4),
        inset 0 0 15px rgba(0, 85, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    /* Cabeçalho */
    .menu-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 85, 255, 0.4);
    }

    .menu-header i {
      font-size: 24px;
      color: #0088ff;
      filter: drop-shadow(0 0 5px #0088ff);
    }

    .menu-header h1 {
      font-size: 20px;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .menu-header span {
      color: #6a42ff;
      font-size: 18px;
      margin-left: 4px;
    }

    /* Lista de Opções */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Item do Menu */
    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8, 20, 50, 0.6);
      border: 1px solid rgba(0, 102, 255, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      transition: all 0.2s ease;
    }

    .option-item:hover {
      border-color: rgba(0, 153, 255, 0.6);
      box-shadow: 0 0 8px rgba(0, 102, 255, 0.2);
    }

    .option-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-info i {
      font-size: 22px;
      color: #00a2ff;
    }

    .option-info span {
      color: #e0e8ff;
      font-size: 15px;
      font-weight: 600;
    }

    /* Custom Switch (Toggle) */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #121c38;
      border: 1px solid rgba(0, 85, 255, 0.4);
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #3b5080;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #0055ff;
      box-shadow: 0 0 10px rgba(0, 85, 255, 0.8);
      border-color: #0088ff;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: #ffffff;
      box-shadow: 0 0 5px #ffffff;
    }
  </style>
</head>
<body>

  <!-- Menu Hub -->
  <div class="menu-container">
    <div class="menu-header">
      <i class="ph ph-crosshair"></i>
      <h1>Manox Hub <span>V1.0</span></h1>
    </div>

    <div class="options-list">
      <!-- Opção 1 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-cube"></i>
          <span>Esp Box</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Opção 2 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-slash"></i>
          <span>Esp Line</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Opção 3 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-heartbeat"></i>
          <span>Esp Health</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Opção 4 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-user"></i>
          <span>Esp Name</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Opção 5 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-ruler"></i>
          <span>Esp Distance</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Opção 6 -->
      <div class="option-item">
        <div class="option-info">
          <i class="ph ph-eye"></i>
          <span>Identify Player</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
