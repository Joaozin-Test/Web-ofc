<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manox Hub — Administração</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                #080b12;

            color: #fff;

            min-height: 100vh;
        }

        .topbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            background:
                #0d111a;

            border-bottom:
                1px solid #202736;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .logo span {
            color: #6c63ff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            color: #aeb7c7;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #35d07f;
        }

        .container {
            width: min(1200px, 94%);

            margin:
                30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #8e98aa;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .card {
            background:
                #10151f;

            border:
                1px solid #202736;

            border-radius: 16px;

            padding: 22px;
        }

        .card-icon {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .card-title {
            color: #8e98aa;
            font-size: 14px;
        }

        .card-value {
            font-size: 30px;
            font-weight: 800;

            margin-top: 5px;
        }

        .panel {
            background:
                #10151f;

            border:
                1px solid #202736;

            border-radius: 16px;

            padding: 22px;

            margin-bottom: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }

        .panel-title {
            font-size: 19px;
            font-weight: 700;
        }

        .add-button {
            border: none;

            background:
                #6c63ff;

            color: white;

            padding:
                10px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 700;
        }

        .add-button:hover {
            opacity: .9;
        }

        .list {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 14px;

            background:
                #0c1018;

            border:
                1px solid #202736;

            border-radius: 11px;
        }

        .user-info {
            min-width: 0;
        }

        .username {
            font-weight: 700;
        }

        .details {
            color: #8791a3;

            font-size: 12px;

            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
        }

        .danger {
            border: none;

            background:
                #dc4657;

            color: white;

            padding:
                8px 12px;

            border-radius: 8px;

            cursor: pointer;
        }

        .edit {
            border: none;

            background:
                #263149;

            color: white;

            padding:
                8px 12px;

            border-radius: 8px;

            cursor: pointer;
        }

        .empty {
            text-align: center;

            color: #727c8e;

            padding: 25px;
        }

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .7);

            z-index: 999;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: min(440px, 100%);

            background:
                #111722;

            border:
                1px solid #283143;

            border-radius: 16px;

            padding: 23px;
        }

        .modal-box h2 {
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;

            font-size: 13px;

            color: #929daf;

            margin-bottom: 7px;
        }

        .field input {
            width: 100%;

            padding: 12px;

            background:
                #090d14;

            border:
                1px solid #293143;

            border-radius: 9px;

            color: white;

            outline: none;
        }

        .field input:focus {
            border-color:
                #6c63ff;
        }

        .modal-actions {
            display: flex;

            gap: 10px;

            margin-top: 18px;
        }

        .modal-actions button {
            flex: 1;

            padding: 11px;

            border-radius: 9px;

            border: none;

            cursor: pointer;

            font-weight: 700;
        }

        .confirm {
            background:
                #6c63ff;

            color: white;
        }

        .cancel {
            background:
                #252d3c;

            color: white;
        }

        .toast {
            position: fixed;

            right: 20px;
            bottom: 20px;

            padding:
                13px 17px;

            background:
                #151c28;

            border:
                1px solid #2a3447;

            border-radius: 10px;

            display: none;

            z-index: 2000;
        }

        .toast.show {
            display: block;
        }

        .loading {
            text-align: center;

            padding: 25px;

            color: #8791a3;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .panel-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .user {
                align-items: flex-start;

                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }

        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="logo">
        Manox <span>Hub</span>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        Administração
    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Painel de Administração
        </h1>

        <p>
            Gerencie os cargos e permissões do Manox Hub.
        </p>

    </div>


    <section class="cards">

        <div class="card">

            <div class="card-icon">
                👑
            </div>

            <div class="card-title">
                Donos
            </div>

            <div
                class="card-value"
                id="ownersCount"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                🛡️
            </div>

            <div class="card-title">
                Admins Permanentes
            </div>

            <div
                class="card-value"
                id="adminsCount"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                ⏱️
            </div>

            <div class="card-title">
                Admins Temporários
            </div>

            <div
                class="card-value"
                id="tempAdminsCount"
            >
                0
            </div>

        </div>

    </section>



    <!-- OWNERS -->

    <section class="panel">

        <div class="panel-header">

            <div class="panel-title">
                👑 Donos
            </div>

            <button
                class="add-button"
                onclick="openAdd('owner')"
            >
                + Adicionar Dono
            </button>

        </div>

        <div
            id="ownersList"
            class="list"
        >
            <div class="loading">
                Carregando...
            </div>
        </div>

    </section>



    <!-- PERMANENT ADMINS -->

    <section class="panel">

        <div class="panel-header">

            <div class="panel-title">
                🛡️ Admins Permanentes
            </div>

            <button
                class="add-button"
                onclick="openAdd('admin')"
            >
                + Adicionar Admin
            </button>

        </div>

        <div
            id="adminsList"
            class="list"
        >
            <div class="loading">
                Carregando...
            </div>
        </div>

    </section>



    <!-- TEMP ADMINS -->

    <section class="panel">

        <div class="panel-header">

            <div class="panel-title">
                ⏱️ Admins Temporários
            </div>

            <button
                class="add-button"
                onclick="openAdd('temp')"
            >
                + Adicionar Temp Admin
            </button>

        </div>

        <div
            id="tempAdminsList"
            class="list"
        >
            <div class="loading">
                Carregando...
            </div>
        </div>

    </section>

</main>



<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            Adicionar
        </h2>

        <div class="field">

            <label>
                Username / UserId
            </label>

            <input
                id="usernameInput"
                placeholder="Ex: Jose123"
            >

        </div>


        <div
            class="field"
            id="durationField"
        >

            <label>
                Duração em minutos
            </label>

            <input
                id="durationInput"
                type="number"
                min="1"
                placeholder="60"
            >

        </div>


        <div
            class="field"
            id="expireField"
            style="display:none"
        >

            <label>
                Nova expiração (timestamp)
            </label>

            <input
                id="expireInput"
                type="number"
                placeholder="Timestamp em ms"
            >

        </div>


        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModal()"
            >
                Cancelar
            </button>

            <button
                class="confirm"
                onclick="submitModal()"
            >
                Confirmar
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>



<script>

const API =
    "https://admin-data.josealessandrosst.workers.dev";


/*
 * ============================================================
 * AUTENTICAÇÃO
 * ============================================================
 */

const params =
    new URLSearchParams(
        window.location.search
    );

const KEY =
    params.get("Key");


if (!KEY) {

    document.body.innerHTML = `
        <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            background:#080b12;
            color:white;
            font-family:Arial;
            text-align:center;
        ">

            <div>

                <h1>
                    🔒 Acesso negado
                </h1>

                <p style="
                    color:#929daf;
                    margin-top:10px;
                ">
                    Chave administrativa não informada.
                </p>

            </div>

        </div>
    `;

    throw new Error(
        "ADMIN KEY não informada"
    );

}


/*
 * A Key é enviada somente para a API.
 */

const requestHeaders = {

    "Content-Type":
        "application/json",

    "x-manox-key":
        KEY

};



/*
 * ============================================================
 * API
 * ============================================================
 */

async function api(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            API + endpoint,
            {
                ...options,

                headers: {
                    ...requestHeaders,
                    ...(options.headers || {})
                }
            }
        );


    let data;

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            data.error ||
            `Erro HTTP ${response.status}`
        );

    }


    return data;

}



/*
 * ============================================================
 * UTILIDADES
 * ============================================================
 */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 3000);

}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function getName(item) {

    if (
        typeof item ===
        "string"
    ) {
        return item;
    }

    return (
        item.username ??
        item.name ??
        item.userId ??
        item.user_id ??
        item.id ??
        "Desconhecido"
    );

}


function getExpires(item) {

    return (
        item.expiresAt ??
        item.expires_at ??
        item.expireAt ??
        item.expire_at ??
        null
    );

}


function formatExpire(value) {

    if (!value) {
        return "Sem expiração";
    }

    const number =
        Number(value);

    if (
        Number.isNaN(number)
    ) {
        return String(value);
    }

    const date =
        new Date(
            number
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(value);
    }

    return date.toLocaleString(
        "pt-BR"
    );

}



/*
 * ============================================================
 * CARREGAR TUDO
 * ============================================================
 */

async function loadAll() {

    try {

        const data =
            await api(
                "/api/manox/all-roles"
            );


        const owners =
            data.owners ||
            data.owner ||
            [];


        const admins =
            data.admins ||
            data.permanentAdmins ||
            [];


        const tempAdmins =
            data.tempAdmins ||
            data.temp_admins ||
            [];


        renderList(
            "ownersList",
            owners,
            "owner"
        );


        renderList(
            "adminsList",
            admins,
            "admin"
        );


        renderList(
            "tempAdminsList",
            tempAdmins,
            "temp"
        );


        document.getElementById(
            "ownersCount"
        ).textContent =
            owners.length;


        document.getElementById(
            "adminsCount"
        ).textContent =
            admins.length;


        document.getElementById(
            "tempAdminsCount"
        ).textContent =
            tempAdmins.length;


    } catch (error) {

        showToast(
            "Erro: " +
            error.message
        );

        console.error(
            error
        );

    }

}



/*
 * ============================================================
 * RENDER
 * ============================================================
 */

function renderList(
    elementId,
    list,
    type
) {

    const element =
        document.getElementById(
            elementId
        );


    if (
        !Array.isArray(list) ||
        list.length === 0
    ) {

        element.innerHTML = `
            <div class="empty">
                Nenhum usuário encontrado.
            </div>
        `;

        return;

    }


    element.innerHTML =
        list.map(item => {

            const name =
                getName(item);

            const expires =
                getExpires(item);


            let details = "";


            if (
                type === "temp"
            ) {

                details =
                    expires
                        ? "Expira em: " +
                          formatExpire(
                              expires
                          )
                        : "Expiração não informada";

            } else {

                details =
                    "Permissão administrativa";

            }


            return `

                <div class="user">

                    <div class="user-info">

                        <div class="username">
                            ${escapeHTML(name)}
                        </div>

                        <div class="details">
                            ${escapeHTML(details)}
                        </div>

                    </div>


                    <div class="actions">

                        ${
                            type === "temp"
                            ? `
                                <button
                                    class="edit"
                                    onclick='editTemp(${JSON.stringify(item)})'
                                >
                                    Editar expiração
                                </button>
                            `
                            : ""
                        }


                        <button
                            class="danger"
                            onclick='removeRole(${JSON.stringify(item)}, "${type}")'
                        >
                            Remover
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}



/*
 * ============================================================
 * MODAL
 * ============================================================
 */

let modalType =
    null;

let editingItem =
    null;


function openAdd(type) {

    modalType =
        type;

    editingItem =
        null;


    document.getElementById(
        "usernameInput"
    ).value = "";


    document.getElementById(
        "durationInput"
    ).value = "60";


    document.getElementById(
        "expireInput"
    ).value = "";


    document.getElementById(
        "expireField"
    ).style.display =
        "none";


    document.getElementById(
        "durationField"
    ).style.display =
        type === "temp"
            ? "block"
            : "none";


    document.getElementById(
        "modalTitle"
    ).textContent =
        type === "owner"
            ? "Adicionar Dono"
            : type === "admin"
                ? "Adicionar Admin Permanente"
                : "Adicionar Temp Admin";


    document.getElementById(
        "modal"
    ).classList.add(
        "active"
    );

}


function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove(
        "active"
    );

}


function editTemp(item) {

    modalType =
        "edit-temp";

    editingItem =
        item;


    document.getElementById(
        "usernameInput"
    ).value =
        getName(item);


    document.getElementById(
        "durationField"
    ).style.display =
        "none";


    document.getElementById(
        "expireField"
    ).style.display =
        "block";


    document.getElementById(
        "expireInput"
    ).value =
        getExpires(item) || "";


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Editar expiração";


    document.getElementById(
        "modal"
    ).classList.add(
        "active"
    );

}



/*
 * ============================================================
 * SUBMIT
 * ============================================================
 */

async function submitModal() {

    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();


    if (!username) {

        showToast(
            "Informe o usuário."
        );

        return;

    }


    try {

        if (
            modalType ===
            "owner"
        ) {

            await api(
                "/api/manox/owners/add",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        }


        else if (
            modalType ===
            "admin"
        ) {

            await api(
                "/api/manox/admins/add",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        }


        else if (
            modalType ===
            "temp"
        ) {

            const duration =
                Number(
                    document.getElementById(
                        "durationInput"
                    ).value
                ) || 60;


            await api(
                "/api/manox/temp-admins/add",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            durationMinutes:
                                duration
                        })
                }
            );

        }


        else if (
            modalType ===
            "edit-temp"
        ) {

            const expiresAt =
                Number(
                    document.getElementById(
                        "expireInput"
                    ).value
                );


            if (
                !expiresAt ||
                Number.isNaN(
                    expiresAt
                )
            ) {

                showToast(
                    "Timestamp inválido."
                );

                return;

            }


            await api(
                "/api/manox/temp-admins/edit-expire",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            expiresAt
                        })
                }
            );

        }


        closeModal();

        showToast(
            "Operação realizada com sucesso!"
        );


        await loadAll();


    } catch (error) {

        showToast(
            "Erro: " +
            error.message
        );

        console.error(
            error
        );

    }

}



/*
 * ============================================================
 * REMOVER
 * ============================================================
 */

async function removeRole(
    item,
    type
) {

    const username =
        getName(item);


    const confirmed =
        confirm(
            `Deseja remover "${username}"?`
        );


    if (!confirmed) {
        return;
    }


    try {

        if (
            type ===
            "owner"
        ) {

            await api(
                "/api/manox/owners/remove",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        }


        else if (
            type ===
            "admin"
        ) {

            await api(
                "/api/manox/admins/remove",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        }


        else if (
            type ===
            "temp"
        ) {

            await api(
                "/api/manox/temp-admins/remove",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username
                        })
                }
            );

        }


        showToast(
            "Usuário removido."
        );


        await loadAll();


    } catch (error) {

        showToast(
            "Erro: " +
            error.message
        );

    }

}



/*
 * ============================================================
 * INICIAR
 * ============================================================
 */

loadAll();


/*
 * Atualizar automaticamente
 * a cada 30 segundos.
 */

setInterval(
    loadAll,
    30000
);

</script>

</body>

</html>
